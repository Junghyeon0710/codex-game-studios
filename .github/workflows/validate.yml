name: Validate Codex port
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/studio.py check
      - run: python tools/compat_inventory.py
      - run: python -m unittest discover -s tests -v
      - name: Check Bash syntax
        shell: bash
        run: |
          find .codex -name '*.sh' -print0 | while IFS= read -r -d '' file; do
            bash -n "$file" || exit 1
          done
